[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "railmind-research"
version = "0.1.0"
description = "可复现的铁路缺陷数据处理、理解、定位与评测工作流"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
images = ["Pillow>=10,<12"]
evaluation = ["pycocotools>=2.0.7,<3"]

[project.scripts]
railmind = "railmind.cli:main"

[tool.setuptools.packages.find]
include = ["railmind*"]

[tool.setuptools.package-data]
railmind = ["assets/**/*"]
